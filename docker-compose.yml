services:
  postgres:
    image: postgres:11.8
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=test
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
    volumes:
      - ./testdata/pg/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: test
    volumes:
      - ./testdata/oracle/:/grackle-initdb.d/
      - ./modules/doobie-oracle/src/test/resources/scripts/:/container-entrypoint-initdb.d/
    healthcheck:
      test: bash -c "[ -f /tmp/healthy ]"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 5s

  benchmark-postgres:
    build: ./testdata/benchmark-pg
    profiles: ["benchmarks"]
    command: ["postgres", "-c", "autovacuum=off"]
    environment:
      - POSTGRES_DB=benchmark
      - POSTGRES_USER=benchmark
      - POSTGRES_PASSWORD=benchmark
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U benchmark -d benchmark"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Sits between the benchmark JVM and benchmark-postgres so a `latency` toxic can be applied
  # per JMH trial (phase 3). It owns host port 5433, which benchmark-postgres used to publish
  # directly — so every existing `jdbc:postgresql://localhost:5433/benchmark` URL keeps working
  # and now transparently runs through the proxy. The proxy itself is created at boot from the
  # mounted config, not via the admin API, so consumers that never touch the API (the test
  # suites, AdventureWorksServer, the other JMH classes) find it already there.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["benchmarks"]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports:
      - "5433:5433"
      - "8474:8474"
    volumes:
      - ./testdata/benchmark-pg/toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      benchmark-postgres:
        condition: service_healthy
    # Exec form, not CMD-SHELL: the toxiproxy image is distroless and has no shell.
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: Test_123_Test
      MSSQL_PID: Developer
      ACCEPT_EULA: Y
      MSSQL_TCP_PORT: 1433
    volumes:
      - ./testdata/mssql/:/grackle-initdb.d/
      - ./modules/doobie-mssql/src/test/resources/scripts/:/container-entrypoint-initdb.d/
    entrypoint: ["/bin/bash", "/container-entrypoint-initdb.d/entrypoint.sh"]
    healthcheck:
      test: bash -c "[ -f /tmp/healthy ]"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 5s
